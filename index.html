<!DOCTYPE html>
<html>
    <head>
        <title>ToDoapp</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <h1 id="heading">
        <span id="to">TO</span>-<span id="do">DO</span>-<span id="list">LIST</span>
       </h1>
        <div id="parent">
            <div id="main">
                <div id="hidden-state">All Tasks are Hidden.<br>Click "Show All Tasks" to View Them.</div>
                <div id="empty-state">No Tasks Added yet.<br>Click "Add Task" to Get Started.</div> 
                <div id="task-box">
                   
                </div>
                <div id="button-section">
                    <div class="button-box"><button id="add">Add Task</button></div>
                    <div class="button-box"><button id="rem">Remove Task</button></div>
                    <div class="button-box"><button id="hide">Hide Finished Tasks</button></div>

                </div>
            </div>
            <div id="bottom">
                <div id="status">Finished:0/0</div>
                <div id="percent">Percentage Completion: 0%</div>
                <div id="remaining">Remaining Tasks: 0</div>
            </div>
            </div>
            <script src="script.js"></script>
    </body>
</html>
